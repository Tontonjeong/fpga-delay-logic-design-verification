  <text x="84" y="181" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="750">FPGA Programmable</text>
  <text x="84" y="245" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="750">Delay Logic</text>
  <text x="84" y="292" fill="#B9C3E1" font-family="Segoe UI, Arial, sans-serif" font-size="23">RTL Architecture · PPA Workflow · File-Driven Verification</text>

