<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Project 2 · Circular-Queue Architecture</title>
<desc id="desc">Programmable delay using one-slot writes and a modulo read address</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0c1d34"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#54c8ff"/>
  </marker>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1450" cy="80" r="240" fill="#284f8c" opacity=".18"/>
<circle cx="80" cy="760" r="260" fill="#0b8f83" opacity=".11"/>
<text x="70" y="80" fill="#f3f7ff" font-size="45" font-weight="850" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Project 2 · Circular-Queue Architecture</text>
<text x="70" y="120" fill="#abc0d8" font-size="22" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Programmable delay using one-slot writes and a modulo read address</text>
<line x1="70" y1="148" x2="1530" y2="148" stroke="#335273" stroke-width="2"/>
<rect x="70" y="260" width="250" height="210" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="70" y="260" width="8" height="210" rx="4" fill="#5ee3c2"/><text x="100" y="308" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Input</text><text x="100" y="346" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="100" dy="0">iData</tspan><tspan x="100" dy="31">iDataEn</tspan><tspan x="100" dy="31">iDelay</tspan></text><rect x="430" y="205" width="590" height="340" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="430" y="205" width="8" height="340" rx="4" fill="#54c8ff"/><text x="460" y="253" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">data_mem / valid_mem</text><rect x="1160" y="260" width="360" height="210" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="1160" y="260" width="8" height="210" rx="4" fill="#f7b84b"/><text x="1190" y="308" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Output</text><text x="1190" y="346" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="1190" dy="0">oDataEn = valid_mem[read]</tspan><tspan x="1190" dy="31">oData updates only when valid</tspan></text><path d="M320,350 L430,350" stroke="#5ee3c2" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="375" y="338" fill="#5ee3c2" font-size="20" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">write</text><path d="M1020,350 L1160,350" stroke="#54c8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="1090" y="338" fill="#54c8ff" font-size="20" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">read</text><circle cx="725" cy="260" r="28" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="725" y="267" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">0</text><circle cx="792" cy="281" r="28" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="792" y="288" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">1</text><circle cx="834" cy="339" r="28" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="834" y="346" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">2</text><circle cx="834" cy="410" r="28" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="834" y="417" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">3</text><circle cx="792" cy="468" r="28" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="792" y="475" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">4</text><circle cx="725" cy="490" r="28" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="725" y="497" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">5</text><circle cx="657" cy="468" r="28" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="657" y="475" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">6</text><circle cx="615" cy="410" r="28" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="615" y="417" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">7</text><circle cx="615" cy="339" r="28" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="615" y="346" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">8</text><circle cx="657" cy="281" r="28" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="657" y="288" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">9</text><text x="725" y="365" fill="#abc0d8" font-size="24" font-weight="800" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">DEPTH</text><text x="725" y="403" fill="#54c8ff" font-size="23" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">ring</text><rect x="240" y="630" width="480" height="150" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="240" y="630" width="8" height="150" rx="4" fill="#a5a3ff"/><text x="270" y="678" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Write pointer</text><text x="270" y="716" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="270" dy="0">write_ptr = (write_ptr + 1) mod DEPTH</tspan><tspan x="270" dy="31">one slot changes per cycle</tspan></text><rect x="850" y="630" width="510" height="150" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="850" y="630" width="8" height="150" rx="4" fill="#f7b84b"/><text x="880" y="678" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Read address</text><text x="880" y="716" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="880" dy="0">read = (write_ptr - iDelay) mod DEPTH</tspan><tspan x="880" dy="31">wrap-around is explicit</tspan></text><path d="M480,630 L595,525" stroke="#a5a3ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1100,630 L875,525" stroke="#f7b84b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<line x1="70" y1="846" x2="1530" y2="846" stroke="#335273" stroke-width="1"/>
<text x="70" y="878" fill="#abc0d8" font-size="18" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Project 2 brief p.1 + repository RTL; no synthesis result is implied.</text>
</svg>
