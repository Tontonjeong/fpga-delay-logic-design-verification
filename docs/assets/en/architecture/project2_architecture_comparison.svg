<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Project 2 · Architecture Comparison</title>
<desc id="desc">Same cycle contract, different storage and selection cost structures</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0c1d34"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#54c8ff"/>
  </marker>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1450" cy="80" r="240" fill="#284f8c" opacity=".18"/>
<circle cx="80" cy="760" r="260" fill="#0b8f83" opacity=".11"/>
<text x="70" y="80" fill="#f3f7ff" font-size="45" font-weight="850" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Project 2 · Architecture Comparison</text>
<text x="70" y="120" fill="#abc0d8" font-size="22" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Same cycle contract, different storage and selection cost structures</text>
<line x1="70" y1="148" x2="1530" y2="148" stroke="#335273" stroke-width="2"/>
<rect x="90" y="220" width="620" height="390" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="90" y="220" width="8" height="390" rx="4" fill="#54c8ff"/><text x="120" y="268" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Shift Register</text><text x="120" y="306" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="120" dy="0">DEPTH×(DATA+VALID) registers</tspan><tspan x="120" dy="31">Every stage shifts</tspan><tspan x="120" dy="31">Tap mux selects iDelay</tspan></text><rect x="890" y="220" width="620" height="390" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="890" y="220" width="8" height="390" rx="4" fill="#5ee3c2"/><text x="920" y="268" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Circular Queue</text><text x="920" y="306" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="920" dy="0">DEPTH slots in data/valid memories</tspan><tspan x="920" dy="31">One slot written per cycle</tspan><tspan x="920" dy="31">Modulo-addressed read</tspan></text><rect x="175" y="440" width="68" height="68" rx="10" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="209" y="482" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Q0</text><path d="M243,474 L270,474" stroke="#54c8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="270" y="440" width="68" height="68" rx="10" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="304" y="482" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Q1</text><path d="M338,474 L365,474" stroke="#54c8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="365" y="440" width="68" height="68" rx="10" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="399" y="482" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Q2</text><path d="M433,474 L460,474" stroke="#54c8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="460" y="440" width="68" height="68" rx="10" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="494" y="482" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Q3</text><path d="M528,474 L555,474" stroke="#54c8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="555" y="440" width="68" height="68" rx="10" fill="#0f1d31" stroke="#54c8ff" stroke-width="2"/><text x="589" y="482" fill="#f3f7ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Q4</text><circle cx="1310" cy="475" r="28" fill="#0f1d31" stroke="#5ee3c2" stroke-width="2"/><circle cx="1277" cy="552" r="28" fill="#0f1d31" stroke="#5ee3c2" stroke-width="2"/><circle cx="1200" cy="585" r="28" fill="#0f1d31" stroke="#5ee3c2" stroke-width="2"/><circle cx="1122" cy="552" r="28" fill="#0f1d31" stroke="#5ee3c2" stroke-width="2"/><circle cx="1090" cy="475" r="28" fill="#0f1d31" stroke="#5ee3c2" stroke-width="2"/><circle cx="1122" cy="397" r="28" fill="#0f1d31" stroke="#5ee3c2" stroke-width="2"/><circle cx="1200" cy="365" r="28" fill="#0f1d31" stroke="#5ee3c2" stroke-width="2"/><circle cx="1277" cy="397" r="28" fill="#0f1d31" stroke="#5ee3c2" stroke-width="2"/><rect x="230" y="690" width="1140" height="120" rx="22" fill="#0f1d31" stroke="#335273" stroke-width="2"/><rect x="230" y="690" width="8" height="120" rx="4" fill="#f7b84b"/><text x="260" y="738" fill="#f3f7ff" font-size="24" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Evidence boundary</text><text x="260" y="776" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="260" dy="0">Functional equivalence is checked in simulation</tspan><tspan x="260" dy="31">Area, Fmax, and power advantages require Quartus reports</tspan></text>
<line x1="70" y1="846" x2="1530" y2="846" stroke="#335273" stroke-width="1"/>
<text x="70" y="878" fill="#abc0d8" font-size="18" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Architecture redraw only. Numerical PPA remains BLOCKED because Quartus is unavailable.</text>
