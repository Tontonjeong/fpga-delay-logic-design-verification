<text x="70" y="878" fill="#abc0d8" font-size="18" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Redrawn from Project 1 brief p.2 + repository RTL; not a source-slide capture.</text>
