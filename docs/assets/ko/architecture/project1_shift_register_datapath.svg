th d="M1205,325 L1280,325" stroke="#a5a3ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="420" y="480" width="730" height="160" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="420" y="480" width="8" height="160" rx="4" fill="#a5a3ff"/><text x="450" y="528" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">제어 로직</text><text x="450" y="566" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="450" dy="0">iDelay=N → tap[N−1]</tspan><tspan x="450" dy="31">reset clears data_q and valid_q</tspan></text><path d="M785,480 L785,430" stroke="#a5a3ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="785" y="418" fill="#a5a3ff" font-size="20" font-weight="700" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">tap select</text><rect x="70" y="670" width="1450" height="150" rx="22" fill="#0f1d31" stroke="#335273" stroke-width="2"/><rect x="70" y="670" width="8" height="150" rx="4" fill="#5ee3c2"/><text x="100" y="718" fill="#f3f7ff" font-size="24" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">핵심 계약</text><text x="100" y="756" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="100" dy="0">유효한 입력만 pipeline에 기록</tspan><tspan x="100" dy="31">data/valid cycle alignment 유지</tspan><tspan x="100" dy="31">iDelay 범위는 RTL parameter로 제한</tspan></text>
