<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Project 1 · Self-Checking 테스트벤치</title>
<desc id="desc">동일 stimulus를 DUT와 독립 reference에 공급하고 cycle 단위로 비교</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0c1d34"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#54c8ff"/>
  </marker>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1450" cy="80" r="240" fill="#284f8c" opacity=".18"/>
<circle cx="80" cy="760" r="260" fill="#0b8f83" opacity=".11"/>
<text x="70" y="80" fill="#f3f7ff" font-size="45" font-weight="850" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Project 1 · Self-Checking 테스트벤치</text>
<text x="70" y="120" fill="#abc0d8" font-size="22" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">동일 stimulus를 DUT와 독립 reference에 공급하고 cycle 단위로 비교</text>
<line x1="70" y1="148" x2="1530" y2="148" stroke="#335273" stroke-width="2"/>
<rect x="80" y="265" width="230" height="180" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="80" y="265" width="8" height="180" rx="4" fill="#5ee3c2"/><text x="110" y="313" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Stimulus</text><text x="110" y="351" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="110" dy="0">clock/reset</tspan><tspan x="110" dy="31">data/valid</tspan><tspan x="110" dy="31">dynamic delay</tspan></text><rect x="475" y="210" width="300" height="180" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="475" y="210" width="8" height="180" rx="4" fill="#a5a3ff"/><text x="505" y="258" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Reference Model</text><text x="505" y="296" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="505" dy="0">cycle queue</tspan><tspan x="505" dy="31">expected data</tspan><tspan x="505" dy="31">expected valid</tspan></text><rect x="475" y="485" width="300" height="180" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="475" y="485" width="8" height="180" rx="4" fill="#54c8ff"/><text x="505" y="533" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">RTL DUT</text><text x="505" y="571" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="505" dy="0">Shift Register</tspan><tspan x="505" dy="31">data/valid pipe</tspan></text><rect x="955" y="335" width="300" height="220" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="955" y="335" width="8" height="220" rx="4" fill="#f7b84b"/><text x="985" y="383" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Checker</text><text x="985" y="421" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="985" dy="0">expected vs actual</tspan><tspan x="985" dy="31">count valid outputs</tspan><tspan x="985" dy="31">fail on mismatch</tspan></text><rect x="1350" y="350" width="170" height="190" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="1350" y="350" width="8" height="190" rx="4" fill="#5ee3c2"/><text x="1380" y="398" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Result</text><text x="1380" y="436" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="1380" dy="0">PASS/FAIL</tspan><tspan x="1380" dy="31">log · VCD</tspan></text><path d="M310,330 L475,300" stroke="#5ee3c2" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M310,380 L475,560" stroke="#5ee3c2" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M775,300 L955,405" stroke="#a5a3ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M775,575 L955,485" stroke="#54c8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1255,445 L1350,445" stroke="#f7b84b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="170" y="720" width="1260" height="90" rx="22" fill="#0f1d31" stroke="#335273" stroke-width="2"/><rect x="170" y="720" width="8" height="90" rx="4" fill="#ff7187"/><text x="200" y="768" fill="#f3f7ff" font-size="24" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">검증 강화</text><text x="200" y="806" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="200" dy="0">강의안의 eye-checking 개념을 repository의 자동 self-checking regression 구조로 확장</tspan></text>
<line x1="70" y1="846" x2="1530" y2="846" stroke="#335273" stroke-width="1"/>
<text x="70" y="878" fill="#abc0d8" font-size="18" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Redrawn from Project 1 brief p.2; PASS claims require executed logs.</text>
</svg>
