<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Project 3 · 시나리오 실행 흐름</title>
<desc id="desc">동일 harness에서 reset, continuous enable, dynamic delay를 순차 검증</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0c1d34"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#54c8ff"/>
  </marker>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1450" cy="80" r="240" fill="#284f8c" opacity=".18"/>
<circle cx="80" cy="760" r="260" fill="#0b8f83" opacity=".11"/>
<text x="70" y="80" fill="#f3f7ff" font-size="45" font-weight="850" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Project 3 · 시나리오 실행 흐름</text>
<text x="70" y="120" fill="#abc0d8" font-size="22" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">동일 harness에서 reset, continuous enable, dynamic delay를 순차 검증</text>
<line x1="70" y1="148" x2="1530" y2="148" stroke="#335273" stroke-width="2"/>
<circle cx="295" cy="255" r="58" fill="#ff7187" opacity=".95"/><text x="295" y="270" fill="#07111f" font-size="42" font-weight="900" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">1</text><rect x="100" y="345" width="390" height="280" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="100" y="345" width="8" height="280" rx="4" fill="#ff7187"/><text x="130" y="393" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">리셋 해제</text><text x="130" y="431" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="130" dy="0">clear state</tspan><tspan x="130" dy="31">valid=0</tspan><tspan x="130" dy="31">first delayed output</tspan></text><circle cx="775" cy="255" r="58" fill="#54c8ff" opacity=".95"/><text x="775" y="270" fill="#07111f" font-size="42" font-weight="900" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">2</text><rect x="580" y="345" width="390" height="280" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="580" y="345" width="8" height="280" rx="4" fill="#54c8ff"/><text x="610" y="393" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">연속 enable</text><text x="610" y="431" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="610" dy="0">back-to-back tokens</tspan><tspan x="610" dy="31">data/valid alignment</tspan><tspan x="610" dy="31">no loss or duplication</tspan></text><circle cx="1255" cy="255" r="58" fill="#a5a3ff" opacity=".95"/><text x="1255" y="270" fill="#07111f" font-size="42" font-weight="900" text-anchor="middle" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">3</text><rect x="1060" y="345" width="390" height="280" rx="22" fill="#172943" stroke="#335273" stroke-width="2"/><rect x="1060" y="345" width="8" height="280" rx="4" fill="#a5a3ff"/><text x="1090" y="393" fill="#f3f7ff" font-size="28" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Delay 변경</text><text x="1090" y="431" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="1090" dy="0">register event</tspan><tspan x="1090" dy="31">new read address</tspan><tspan x="1090" dy="31">deterministic comparison</tspan></text><path d="M490,485 L580,485" stroke="#54c8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M970,485 L1060,485" stroke="#54c8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="315" y="640" width="970" height="180" rx="22" fill="#0f1d31" stroke="#335273" stroke-width="2"/><rect x="315" y="640" width="8" height="180" rx="4" fill="#5ee3c2"/><text x="345" y="688" fill="#f3f7ff" font-size="24" font-weight="750" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">공통 Checker</text><text x="345" y="726" fill="#abc0d8" font-size="21" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif"><tspan x="345" dy="0">cycle-by-cycle data/valid</tspan><tspan x="345" dy="31">output count</tspan><tspan x="345" dy="31">scenario-specific PASS marker</tspan></text>
<line x1="70" y1="846" x2="1530" y2="846" stroke="#335273" stroke-width="1"/>
<text x="70" y="878" fill="#abc0d8" font-size="18" font-weight="500" text-anchor="start" font-family="Inter,Pretendard,Malgun Gothic,Segoe UI,Arial,sans-serif">Project 3 brief pp.1–2; executed scenario counts are reported in verification_summary.json.</text>
</svg>
