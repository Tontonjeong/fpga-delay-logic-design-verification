<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">PPA 비교 매트릭스</title>
  <desc id="desc">동일 조건에서 깊이 10·100의 시프트 레지스터와 순환 큐 4개 구성을 비교합니다.</desc>
  <rect width="1200" height="650" rx="24" fill="#F6F8FC"/>
  <text x="58" y="70" fill="#0B1531" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="750">4개 구성 PPA 비교</text>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
    <text x="390" y="132" fill="#197FA5" font-size="21" font-weight="750" text-anchor="middle">DEPTH = 10</text>
    <text x="840" y="132" fill="#6C42D9" font-size="21" font-weight="750" text-anchor="middle">DEPTH = 100</text>
    <text x="62" y="240" fill="#0B1531" font-size="20" font-weight="750">시프트 레지스터</text>
    <text x="62" y="418" fill="#0B1531" font-size="20" font-weight="750">순환 큐</text>
    <rect x="250" y="168" width="280" height="124" rx="18" fill="#E8F7FC" stroke="#34AAD4" stroke-width="2"/>
    <text x="390" y="215" fill="#0B1531" font-size="22" font-weight="750" text-anchor="middle">shift_depth10</text>
    <text x="390" y="251" fill="#53617D" font-size="17" text-anchor="middle">기준 규모</text>
    <rect x="700" y="168" width="280" height="124" rx="18" fill="#E8F7FC" stroke="#34AAD4" stroke-width="2"/>
    <text x="840" y="215" fill="#0B1531" font-size="22" font-weight="750" text-anchor="middle">shift_depth100</text>
    <text x="840" y="251" fill="#53617D" font-size="17" text-anchor="middle">라우팅 / 스위칭 규모</text>
    <rect x="250" y="346" width="280" height="124" rx="18" fill="#F0EBFF" stroke="#8B5CF6" stroke-width="2"/>
    <text x="390" y="393" fill="#0B1531" font-size="22" font-weight="750" text-anchor="middle">circular_depth10</text>
    <text x="390" y="429" fill="#53617D" font-size="17" text-anchor="middle">포인터 오버헤드 확인</text>
    <rect x="700" y="346" width="280" height="124" rx="18" fill="#F0EBFF" stroke="#8B5CF6" stroke-width="2"/>
    <text x="840" y="393" fill="#0B1531" font-size="22" font-weight="750" text-anchor="middle">circular_depth100</text>
    <text x="840" y="429" fill="#53617D" font-size="17" text-anchor="middle">메모리 추론 가능성</text>
    <rect x="58" y="520" width="1084" height="82" rx="16" fill="#FFFFFF" stroke="#D5DDED" stroke-width="2"/>
    <text x="600" y="553" fill="#0B1531" font-size="17" font-weight="700" text-anchor="middle">공통 조건: Agilex 5 A5ED065BB32AE6SR0 · 100 MHz · BALANCED · Virtual Pins</text>
    <text x="600" y="582" fill="#53617D" font-size="16" text-anchor="middle">Vectorless Power Analyzer · 12.5% toggle assumption · ALM / Registers / Memory / Fmax / Power</text>
    <text x="600" y="628" fill="#A86500" font-size="16" font-weight="700" text-anchor="middle">흐름 구성 완료 · 검증 호스트에 Quartus 없음 · 수치 PPA BLOCKED</text>
  </g>
</svg>

